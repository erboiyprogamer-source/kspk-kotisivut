<!-- =====================================================================
     SIVUPOHJA — kopioi tämä tiedosto uudeksi sivuksi.
     1) Nimeä esim. "tapahtumat.html"
     2) Vaihda <title> ja description yllä
     3) Lisää sivu assets/js/site.js -tiedoston SITE.pages-listaan

       data-reveal            (alhaalta)   data-reveal="left" / "right"
